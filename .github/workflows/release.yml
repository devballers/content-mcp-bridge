name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin header version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          header_version=$(grep -m1 '^ \* Version:' content-mcp-bridge.php | sed 's/.*Version: *//')
          if [ "$tag_version" != "$header_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match 'Version: $header_version' in content-mcp-bridge.php"
            exit 1
          fi

      - name: Build release zip
        run: git archive --prefix=content-mcp-bridge/ -o content-mcp-bridge.zip "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" content-mcp-bridge.zip --title "$GITHUB_REF_NAME" --generate-notes
